name: Build & Release

# v*.*.* 태그를 푸시하거나, Actions 탭 → "Build & Release" → Run workflow 로 실행하면
# 크롬 확장 zip, 유니티 패키지(.unitypackage), ALCOM/VCC 용 패키지 zip 으로 릴리즈를 만든다.
# v0.4 부터는 exe 가 없다.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 0.4.0)"
        required: true
        default: "0.4.0"
      prerelease:
        description: "프리릴리즈로 올리기"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check versions
        run: |
          v="${VERSION#v}"
          ext=$(python -c "import json;print(json.load(open('chrome_extension/manifest.json'))['version'])")
          pkg=$(python -c "import json;print(json.load(open('unity_package/BoothImportManager/package.json'))['version'])")
          echo "release=$v extension=$ext unity=$pkg"
          test "$ext" = "$v" && test "$pkg" = "$v"
          test -f "docs/release-notes-v$v.md"

      - name: Package release files
        run: |
          v="${VERSION#v}"
          mkdir -p release
          (cd chrome_extension && zip -qr "../release/BoothImportManager-ChromeExtension-v$v.zip" .)
          python scripts/make_unitypackage.py "release/BoothImportManager-Unity-v$v.unitypackage"
          python scripts/make_vpm.py zip "release/local.booth-import-manager-$v.zip"
          ls -l release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${VERSION#v}"
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" release/* --clobber
            gh release edit "v$v" --title "Booth Import Manager v$v" --notes-file "docs/release-notes-v$v.md"
          else
            gh release create "v$v" release/* --title "Booth Import Manager v$v" --notes-file "docs/release-notes-v$v.md" --target "$GITHUB_SHA" $flags
          fi
