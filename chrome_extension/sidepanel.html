<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booth Import Manager</title>
    <link rel="stylesheet" href="ui/ui.css" />
    <link rel="stylesheet" href="ui/sidepanel.css" />
  </head>
  <body>
    <header class="sp-head">
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <strong>Booth Import</strong>
      <span id="conn" class="conn"><span class="dot"></span><span id="connText">확인 중…</span></span>
      <span class="grow"></span>
      <button id="themeBtn" class="btn icon-btn ghost" title="부스 테마 (라이트/다크)">☾</button>
      <button id="refreshBtn" class="btn icon-btn ghost" title="새로고침">↻</button>
      <button id="manageBtn" class="btn small" title="태그·프로젝트 관리">관리</button>
    </header>

    <section id="offline" class="card offline hidden">
      <strong>아직 유니티 프로젝트 목록이 없어요</strong>
      <p class="muted">BIM 패키지가 설치된 유니티 프로젝트를 하나 켜거나, 관리 페이지에서 ALCOM/VCC 프로젝트 폴더를 등록하세요.</p>
      <button id="retryBtn" class="btn primary">관리 페이지 열기</button>
    </section>

    <section id="target" class="card target">
      <div class="step"><span class="num">1</span><select id="projectSel" class="grow" aria-label="유니티 프로젝트"></select></div>
      <div class="step"><span class="num">2</span><select id="tagSel" class="grow" aria-label="태그"></select></div>
      <div id="projectInfo" class="muted small-text"></div>
    </section>

    <nav class="tabs" role="tablist">
      <button class="active" data-tab="files">보낸 기록</button>
      <button data-tab="queue">대기열</button>
      <button data-tab="presets">프리셋</button>
      <button data-tab="wish">찜 정리</button>
    </nav>

    <section id="tab-files" class="tab">
      <div class="row filter-row">
        <select id="fileFilter" aria-label="필터">
          <option value="recent">최근</option>
          <option value="todo">실패·패키지 없음</option>
          <option value="all">전체 (숨김 포함)</option>
          <option value="queued">대기 중</option>
          <option value="imported">임포트됨</option>
        </select>
        <label class="row muted"><input id="selectAll" type="checkbox" /> 전체 선택</label>
      </div>
      <div id="fileList" class="list"></div>
      <footer class="actions">
        <button id="queueBtn" class="btn primary grow" disabled>3 ▶ 선택한 것 다시 보내기</button>
        <button id="hideBtn" class="btn" disabled title="목록에서만 숨김">숨김</button>
        <button id="deleteBtn" class="btn danger" disabled title="기록만 지워요 (파일은 그대로)">기록 삭제</button>
      </footer>
    </section>

    <section id="tab-queue" class="tab hidden">
      <div id="queueList" class="list"></div>
    </section>

    <section id="tab-presets" class="tab hidden">
      <div class="row filter-row">
        <select id="presetSel" class="grow" aria-label="에셋 프리셋"></select>
        <button id="presetManageBtn" class="btn small" title="관리 페이지에서 편집">편집</button>
      </div>
      <div id="presetItems" class="list"></div>
      <footer class="actions">
        <button id="presetSendBtn" class="btn primary grow" disabled>1번에서 고른 프로젝트로 한번에 보내기</button>
      </footer>
    </section>
    <section id="tab-wish" class="tab hidden">
      <p class="muted">구매한 상품이 찜목록에 있으면 아래 규칙대로 정리해요. 먼저 미리보기로 확인한 뒤 실행돼요.</p>
      <div class="card wish-rules">
        <div class="wish-rule" data-cat="full">
          <span class="chip ok">풀팩 구매</span>
          <select class="wish-action"><option value="list">리스트로 분류</option><option value="remove">찜 삭제</option><option value="keep">그대로</option></select>
          <input class="wish-name" type="text" value="풀팩 구매" aria-label="리스트 이름" />
        </div>
        <div class="wish-rule" data-cat="partial">
          <span class="chip warn">일부 구매</span>
          <select class="wish-action"><option value="list">리스트로 분류</option><option value="remove">찜 삭제</option><option value="keep">그대로</option></select>
          <input class="wish-name" type="text" value="일부 구매" aria-label="리스트 이름" />
        </div>
        <div class="wish-rule" data-cat="single">
          <span class="chip">구매 (옵션 1개)</span>
          <select class="wish-action"><option value="list">리스트로 분류</option><option value="remove">찜 삭제</option><option value="keep">그대로</option></select>
          <input class="wish-name" type="text" value="구매" aria-label="리스트 이름" />
        </div>
      </div>
      <div class="row wish-buttons">
        <button id="wishScanBtn" class="btn grow">미리보기</button>
        <button id="wishApplyBtn" class="btn primary grow" disabled>실행</button>
      </div>
      <div id="wishSummary"></div>
      <div id="wishList" class="list"></div>
      <div id="wishLog" class="log hidden"></div>
    </section>

    <script type="module" src="ui/sidepanel.js"></script>
  </body>
</html>
